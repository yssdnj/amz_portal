server {
    listen 8080;
    server_name 47.84.113.76;

    # /products（无尾斜杠）→ 301 重定向到 /products/
    location = /products {
        return 301 /products/;
    }

    # 产品档案 → 127.0.0.1:5003
    location /products/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ads（无尾斜杠）→ 301 重定向到 /ads/
    location = /ads {
        return 301 /ads/;
    }

    # /toolkit（无尾斜杠）→ 301 重定向到 /toolkit/
    location = /toolkit {
        return 301 /toolkit/;
    }

    # 广告漏斗分析 → 127.0.0.1:5001
    location /ads/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 运营工具箱 → 127.0.0.1:5002（SSE 支持）
    location /toolkit/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 SSE 实时日志流
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # /xiyou（无尾斜杠）→ 301 重定向到 /xiyou/
    location = /xiyou {
        return 301 /xiyou/;
    }

    # 西柚关键词 → 127.0.0.1:5004
    location /xiyou/ {
        proxy_pass http://127.0.0.1:5004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Amazon Selling Partner API -> 127.0.0.1:8015
    location = /amazon-official-sp {
        return 301 /amazon-official-sp/;
    }

    location /amazon-official-sp/ {
        proxy_pass http://127.0.0.1:8015/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        sub_filter "'/api/" "'/amazon-official-sp/api/";
        sub_filter '"/api/' '"/amazon-official-sp/api/';
        sub_filter "'/static/" "'/amazon-official-sp/static/";
        sub_filter '"/static/' '"/amazon-official-sp/static/';
    }

    # Amazon Ads API Explorer -> 127.0.0.1:5010
    location = /amazon-official-ads {
        return 301 /amazon-official-ads/;
    }

    location /amazon-official-ads/ {
        proxy_pass http://127.0.0.1:5010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        sub_filter "'/api/" "'/amazon-official-ads/api/";
        sub_filter '"/api/' '"/amazon-official-ads/api/';
    }

    # 门户主页 → 127.0.0.1:5000
    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
