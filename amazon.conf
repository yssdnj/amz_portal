# Portal page. Keep this after all longer /amazon/... locations.
location ^~ /amazon/ {
    auth_request /_amazon_session;
    error_page 401 = @amazon_login_required;
    proxy_pass http://127.0.0.1:5000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^(/.*)$ /amazon$1;
    proxy_cookie_path / /amazon/;
    sub_filter_once off;
    sub_filter 'href="/products/"' 'href="/amazon/products/"';
    sub_filter 'href="/ads/"' 'href="/amazon/ads/"';
    sub_filter 'href="/toolkit/"' 'href="/amazon/toolkit/"';
    sub_filter 'href="/xiyou/"' 'href="/amazon/xiyou/"';
    sub_filter 'href="/amazon-official-sp/"' 'href="/amazon/official-sp/"';
    sub_filter 'href="/amazon-official-ads/"' 'href="/amazon/official-ads/"';
    sub_filter "/api/" "/amazon/api/";
    include snippets/proxy-common.conf;
}
