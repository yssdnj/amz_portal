# Amazon Tools routes for the shared HTTPS gateway.
#
# Copy this file to the gateway's nginx/conf.d/ directory. It is included
# inside the existing 8443 server block, so do not add http/server/listen here.
# The gateway must already define snippets/proxy-common.conf.

location = /amazon { return 308 /amazon/; }

location = /_amazon_session {
    internal;
    proxy_pass http://127.0.0.1:5000/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $http_host;
    include snippets/proxy-common.conf;
}

location @amazon_login_required {
    return 302 /amazon/login?next=$uri;
}

location = /amazon/login {
    proxy_pass http://127.0.0.1:5000/login;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon;
    include snippets/proxy-common.conf;
}

location = /amazon/api/auth/login {
    proxy_pass http://127.0.0.1:5000/api/auth/login;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon;
    include snippets/proxy-common.conf;
}

location = /amazon/api/auth/logout {
    proxy_pass http://127.0.0.1:5000/api/auth/logout;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon;
    include snippets/proxy-common.conf;
}

# Portal control/status API. Keep API authentication failures as HTTP 401.
location ^~ /amazon/api/ {
    auth_request /_amazon_session;
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon;
    include snippets/proxy-common.conf;
}

# Product Catalog
location = /amazon/products { return 308 /amazon/products/; }
location ^~ /amazon/products/api/ {
    auth_request /_amazon_session;
    proxy_pass http://127.0.0.1:5003/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon/products;
    include snippets/proxy-common.conf;
}
location ^~ /amazon/products/ {
    auth_request /_amazon_session;
    error_page 401 = @amazon_login_required;
    proxy_pass http://127.0.0.1:5003/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon/products;
    proxy_redirect ~^(/products/.*)$ /amazon$1;
    proxy_cookie_path / /amazon/products/;
    include snippets/proxy-common.conf;
}

# Ads Funnel Analytics
location = /amazon/ads { return 308 /amazon/ads/; }
location ^~ /amazon/ads/api/ {
    auth_request /_amazon_session;
    proxy_pass http://127.0.0.1:5001/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon/ads;
    include snippets/proxy-common.conf;
}
location ^~ /amazon/ads/ {
    auth_request /_amazon_session;
    error_page 401 = @amazon_login_required;
    proxy_pass http://127.0.0.1:5001/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Prefix /amazon/ads;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^(/.*)$ /amazon/ads$1;
    proxy_cookie_path / /amazon/ads/;
    sub_filter_once off;
    sub_filter_types application/javascript text/css;
    sub_filter "/api/" "/amazon/ads/api/";
    sub_filter "/static/" "/amazon/ads/static/";
    include snippets/proxy-common.conf;
}

